name: study_planner

description: "A study planner application."

publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ^3.12.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8
  url_launcher: ^6.3.2
  flutter_bloc: ^9.1.1
  get_it: ^9.2.1
  isar: ^3.1.0+1
  isar_flutter_libs: ^3.1.0+1
  fl_chart: ^1.2.0
  flutter_local_notifications: ^22.2.0
  flutter_background_service: ^5.1.0
  flutter_timezone: ^5.1.0
  confetti: ^0.8.0
  intl: ^0.20.2
  go_router: ^17.4.0
  path_provider: ^2.1.5
  timezone: ^0.11.1
  audioplayers: ^6.1.0
  supabase_flutter: ^2.8.4
  crypto: ^3.0.6

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  isar_generator: ^3.1.0+1
  build_runner: ^2.4.13
  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
  android: true
  ios: true

  image_path: "assets/icons/app_icon.jpg"

  min_sdk_android: 21

  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/icons/app_icon.jpg"
  adaptive_icon_monochrome: "assets/icons/app_icon_monochrome.jpg"
  adaptive_icon_foreground_inset: 12

  remove_alpha_ios: true
  background_color_ios: "#FFFFFF"

flutter:
  generate: true
  uses-material-design: true


  assets:
    - assets/sounds/